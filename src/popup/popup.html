<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chirp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Chirp</h1>
      <span id="date"></span>
    </header>
    <div id="stats">
      <div class="stat">
        <span class="stat-value" id="tweet-count">--</span>
        <span class="stat-label">Tweets Read</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="liked-count">--</span>
        <span class="stat-label">Liked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="bookmarked-count">--</span>
        <span class="stat-label">Bookmarked</span>
      </div>
    </div>
    <div id="actions">
      <button id="open-digest">Open Full Digest</button>
      <button id="open-settings">Settings</button>
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
